<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="sleepoutside-header">
    </header>

    <main class="divider">
      <section class="customer-info">
        <h2>Review & Place your Order</h2>

        <form id="checkout-form" class="checkout-form">
          <fieldset>
            <legend>Customer</legend>

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" autocomplete="given-name" />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" autocomplete="family-name" />
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" autocomplete="street-address" />

            <label for="city">City</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" />

            <label for="state">State</label>
            <input type="text" id="state" name="state" autocomplete="address-level1" />

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" autocomplete="postal-code" />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" autocomplete="cc-number" />

            <label for="expiration">Expiration Date</label>
            <input type="text" id="expiration" name="expiration" autocomplete="cc-exp" />

            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" autocomplete="cc-csc" />
          </fieldset>

          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>

      </section>
      
      <section class="order-summary">
      </section>
    </main>

    <footer id="sleepoutside-footer">
    </footer>
  </body>
</html>
